<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConverterYL - Audio Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0d0f14;
            --bg-secondary: #151820;
            --bg-card: #1a1e28;
            --bg-card-hover: #1f2433;
            --bg-input: #12151c;
            --border: #2a2f3d;
            --border-light: #343a4d;
            --text-primary: #e8eaf0;
            --text-secondary: #8a90a4;
            --text-muted: #5c6178;
            --accent: #00d68f;
            --accent-dim: rgba(0, 214, 143, 0.12);
            --accent-glow: rgba(0, 214, 143, 0.25);
            --danger: #ff5c72;
            --danger-dim: rgba(255, 92, 114, 0.12);
            --warning: #ffb547;
            --warning-dim: rgba(255, 181, 71, 0.12);
            --info: #4da6ff;
            --info-dim: rgba(77, 166, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Container mobile-first */
        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: var(--bg-primary);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === HEADER === */
        .app-header {
            padding: 18px 20px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            position: relative;
            z-index: 10;
        }

        .app-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20px;
            right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), #00b87a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #0d0f14;
            box-shadow: 0 2px 12px var(--accent-glow);
        }

        .app-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .app-title span {
            color: var(--accent);
        }

        .header-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            background: var(--accent-dim);
            color: var(--accent);
            letter-spacing: 0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .header-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        /* === MAIN CONTENT === */
        .app-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .app-body::-webkit-scrollbar {
            width: 4px;
        }

        .app-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .app-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* === FORMAT SELECTOR === */
        .format-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .format-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            white-space: nowrap;
        }

        .format-select-wrapper {
            flex: 1;
            position: relative;
        }

        .format-select {
            width: 100%;
            padding: 10px 36px 10px 14px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            appearance: none;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
        }

        .format-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
        }

        .format-select-wrapper::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 11px;
            pointer-events: none;
        }

        /* === UPLOAD LIST === */
        .section-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px 10px;
            border-bottom: 1px solid var(--border);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .section-title i {
            font-size: 12px;
            color: var(--accent);
        }

        .file-count {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            background: var(--accent-dim);
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }

        .section-body {
            padding: 6px;
            max-height: 260px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .section-body::-webkit-scrollbar {
            width: 3px;
        }

        .section-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* File Item */
        .file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            border-radius: 8px;
            transition: all 0.15s;
            cursor: default;
            position: relative;
        }

        .file-item:hover {
            background: var(--bg-card-hover);
        }

        .file-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .file-icon.mp3 { background: var(--accent-dim); color: var(--accent); }
        .file-icon.ogg { background: var(--info-dim); color: var(--info); }
        .file-icon.wav { background: var(--warning-dim); color: var(--warning); }
        .file-icon.flac { background: rgba(168, 85, 247, 0.12); color: #a855f7; }
        .file-icon.default { background: var(--danger-dim); color: var(--danger); }

        .file-info {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 10.5px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 2px;
        }

        .file-remove {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.15s;
            flex-shrink: 0;
            opacity: 0;
        }

        .file-item:hover .file-remove {
            opacity: 1;
        }

        .file-remove:hover {
            background: var(--danger-dim);
            color: var(--danger);
        }

        /* File status */
        .file-status {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            flex-shrink: 0;
        }

        .file-status.pending {
            border: 1.5px solid var(--text-muted);
        }

        .file-status.converting {
            border: 1.5px solid var(--warning);
            background: var(--warning-dim);
            color: var(--warning);
            animation: spin 1s linear infinite;
        }

        .file-status.done {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1.5px solid var(--accent);
        }

        .file-status.error {
            background: var(--danger-dim);
            color: var(--danger);
            border: 1.5px solid var(--danger);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty state */
        .empty-state {
            padding: 30px 20px;
            text-align: center;
        }

        .empty-state i {
            font-size: 28px;
            color: var(--text-muted);
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* === LOG CONSOLE === */
        .log-section {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .log-section .section-card {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .log-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .log-action-btn {
            padding: 3px 8px;
            border-radius: 5px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'JetBrains Mono', monospace;
        }

        .log-action-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .log-body {
            flex: 1;
            padding: 8px 10px;
            overflow-y: auto;
            max-height: 200px;
            min-height: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            line-height: 1.7;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .log-body::-webkit-scrollbar {
            width: 3px;
        }

        .log-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .log-line {
            display: flex;
            gap: 8px;
            animation: logFade 0.25s ease;
        }

        @keyframes logFade {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-time {
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .log-msg { flex: 1; }
        .log-msg.info { color: var(--text-secondary); }
        .log-msg.success { color: var(--accent); }
        .log-msg.warn { color: var(--warning); }
        .log-msg.error { color: var(--danger); }
        .log-msg.system { color: var(--info); }

        .log-empty {
            color: var(--text-muted);
            font-style: italic;
            padding: 20px 0;
            text-align: center;
        }

        /* === BOTTOM ACTIONS === */
        .bottom-actions {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
            display: flex;
            gap: 10px;
            position: relative;
            z-index: 10;
        }

        .bottom-actions::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 16px;
            right: 16px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: all 0.2s;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .btn-upload {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-upload:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
            color: var(--accent);
        }

        .btn-upload:active {
            transform: scale(0.97);
        }

        .btn-convert {
            background: linear-gradient(135deg, var(--accent), #00b87a);
            color: #0d0f14;
            box-shadow: 0 2px 16px var(--accent-glow);
        }

        .btn-convert:hover {
            box-shadow: 0 4px 24px var(--accent-glow);
            filter: brightness(1.08);
        }

        .btn-convert:active {
            transform: scale(0.97);
        }

        .btn-convert:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: none;
            box-shadow: none;
        }

        .btn i {
            font-size: 13px;
        }

        /* === TOAST === */
        .toast-container {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
            pointer-events: auto;
            white-space: nowrap;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .toast.success {
            background: #0d2818;
            border: 1px solid #1a5c35;
            color: var(--accent);
        }

        .toast.error {
            background: #2a0f14;
            border: 1px solid #5c1a24;
            color: var(--danger);
        }

        .toast.info {
            background: #0d1a2a;
            border: 1px solid #1a355c;
            color: var(--info);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-8px); }
        }

        /* === DROP ZONE OVERLAY === */
        .drop-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 214, 143, 0.06);
            border: 2px dashed var(--accent);
            border-radius: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 50;
            backdrop-filter: blur(4px);
        }

        .drop-overlay.active {
            display: flex;
        }

        .drop-overlay-text {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
        }

        /* === PROGRESS BAR (per file) === */
        .file-progress {
            height: 2px;
            border-radius: 2px;
            background: var(--border);
            margin-top: 4px;
            overflow: hidden;
            display: none;
        }

        .file-progress.active {
            display: block;
        }

        .file-progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Hidden file input */
        #fileInput {
            display: none;
        }

        /* Responsive: desktop */
        @media (min-width: 500px) {
            body {
                padding: 24px 0;
                align-items: center;
            }

            .app-container {
                min-height: auto;
                max-height: 90vh;
                border-radius: 20px;
                border: 1px solid var(--border);
                box-shadow: 0 20px 80px rgba(0,0,0,0.5);
                overflow: hidden;
            }

            .app-body {
                max-height: calc(90vh - 130px);
            }
        }

        /* Pulse glow on converting */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
            50% { box-shadow: 0 0 0 6px transparent; }
        }

        .file-status.converting {
            animation: spin 1s linear infinite, pulseGlow 1.5s ease infinite;
        }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo-icon">
                <i class="fas fa-waveform-lines"></i>
            </div>
            <div>
                <div class="app-title">Converter<span>YL</span></div>
            </div>
        </div>
        <div class="header-right">
            <span class="header-badge">AUDIO</span>
            <button class="header-btn" id="btnClearAll" title="Hapus Semua">
                <i class="fas fa-trash-can"></i>
            </button>
        </div>
    </header>

    <!-- Body -->
    <main class="app-body" id="appBody">
        <!-- Format Selector -->
        <div class="format-section">
            <span class="format-label">Output</span>
            <div class="format-select-wrapper">
                <select class="format-select" id="formatSelect">
                    <option value="mp3">MP3 - MPEG Audio</option>
                    <option value="wav">WAV - Waveform Audio</option>
                    <option value="ogg">OGG - Ogg Vorbis</option>
                    <option value="flac">FLAC - Free Lossless</option>
                    <option value="aac">AAC - Advanced Audio</option>
                    <option value="m4a">M4A - MPEG-4 Audio</option>
                </select>
            </div>
        </div>

        <!-- Upload List -->
        <div class="section-card" id="uploadListCard">
            <div class="section-header">
                <div class="section-title">
                    <i class="fas fa-list-ul"></i>
                    Upload List
                </div>
                <span class="file-count" id="fileCount">0</span>
            </div>
            <div class="section-body" id="fileList">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-cloud-arrow-up"></i>
                    <p>Belum ada file. Tap Upload Audio.</p>
                </div>
            </div>
            <div class="drop-overlay" id="dropOverlay">
                <span class="drop-overlay-text"><i class="fas fa-download"></i> Lepaskan file di sini</span>
            </div>
        </div>

        <!-- Log Console -->
        <div class="log-section">
            <div class="section-card">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-terminal"></i>
                        Log Console
                    </div>
                    <div class="log-header-actions">
                        <button class="log-action-btn" id="btnClearLog">CLEAR</button>
                    </div>
                </div>
                <div class="log-body" id="logBody">
                    <div class="log-empty">Menunggu aktivitas...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Actions -->
    <div class="bottom-actions">
        <button class="btn btn-upload" id="btnUpload">
            <i class="fas fa-plus"></i>
            Upload Audio
        </button>
        <button class="btn btn-convert" id="btnConvert" disabled>
            <i class="fas fa-bolt"></i>
            Convert
        </button>
    </div>

    <input type="file" id="fileInput" accept="audio/*" multiple>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
    // === State ===
    let files = [];
    let isConverting = false;
    let logCleared = false;

    // === DOM ===
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const emptyState = document.getElementById('emptyState');
    const fileCount = document.getElementById('fileCount');
    const logBody = document.getElementById('logBody');
    const btnUpload = document.getElementById('btnUpload');
    const btnConvert = document.getElementById('btnConvert');
    const btnClearAll = document.getElementById('btnClearAll');
    const btnClearLog = document.getElementById('btnClearLog');
    const formatSelect = document.getElementById('formatSelect');
    const appContainer = document.getElementById('appContainer');
    const dropOverlay = document.getElementById('dropOverlay');
    const toastContainer = document.getElementById('toastContainer');

    // === Format ukuran file ===
    function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // === Waktu saat ini ===
    function timeNow() {
        const d = new Date();
        return d.toTimeString().split(' ')[0];
    }

    // === Toast ===
    function showToast(msg, type = 'info') {
        const icons = { success: 'fa-check-circle', error: 'fa-circle-xmark', info: 'fa-circle-info' };
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<i class="fas ${icons[type]}"></i> ${msg}`;
        toastContainer.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // === Logging ===
    function addLog(msg, type = 'info') {
        if (logCleared) {
            logBody.innerHTML = '';
            logCleared = false;
        }
        // Hapus empty state
        const empty = logBody.querySelector('.log-empty');
        if (empty) empty.remove();

        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerHTML = `<span class="log-time">${timeNow()}</span><span class="log-msg ${type}">${msg}</span>`;
        logBody.appendChild(line);
        logBody.scrollTop = logBody.scrollHeight;
    }

    // === Dapatkan extension ===
    function getExt(name) {
        return name.split('.').pop().toLowerCase();
    }

    // === Icon class berdasarkan ext ===
    function getIconClass(ext) {
        const map = { mp3: 'mp3', ogg: 'ogg', wav: 'wav', flac: 'flac' };
        return map[ext] || 'default';
    }

    // === Icon FA berdasarkan ext ===
    function getIconFA(ext) {
        const map = { mp3: 'fa-music', ogg: 'fa-compact-disc', wav: 'fa-wave-square', flac: 'fa-compact-disc' };
        return map[ext] || 'fa-file-audio';
    }

    // === Render file list ===
    function renderFiles() {
        // Bersihkan kecuali empty state
        fileList.innerHTML = '';
        fileCount.textContent = files.length;

        if (files.length === 0) {
            fileList.innerHTML = `<div class="empty-state" id="emptyState"><i class="fas fa-cloud-arrow-up"></i><p>Belum ada file. Tap Upload Audio.</p></div>`;
            btnConvert.disabled = true;
            return;
        }

        btnConvert.disabled = isConverting;

        files.forEach((f, i) => {
            const ext = getExt(f.name);
            const iconClass = getIconClass(ext);
            const iconFA = getIconFA(ext);

            const item = document.createElement('div');
            item.className = 'file-item';
            item.setAttribute('data-index', i);

            let statusHTML = '';
            if (f.status === 'pending') {
                statusHTML = `<div class="file-status pending"></div>`;
            } else if (f.status === 'converting') {
                statusHTML = `<div class="file-status converting"><i class="fas fa-spinner"></i></div>`;
            } else if (f.status === 'done') {
                statusHTML = `<div class="file-status done"><i class="fas fa-check"></i></div>`;
            } else if (f.status === 'error') {
                statusHTML = `<div class="file-status error"><i class="fas fa-xmark"></i></div>`;
            }

            const progressHTML = f.status === 'converting'
                ? `<div class="file-progress active"><div class="file-progress-bar" id="progress-${i}" style="width:${f.progress || 0}%"></div></div>`
                : '';

            item.innerHTML = `
                <div class="file-icon ${iconClass}"><i class="fas ${iconFA}"></i></div>
                <div class="file-info">
                    <div class="file-name" title="${f.name}">${f.name}</div>
                    <div class="file-meta">${formatSize(f.size)} · ${ext.toUpperCase()}</div>
                    ${progressHTML}
                </div>
                ${statusHTML}
                <button class="file-remove" onclick="removeFile(${i})" title="Hapus"><i class="fas fa-xmark"></i></button>
            `;

            fileList.appendChild(item);
        });
    }

    // === Tambah file ===
    function addFiles(fileListObj) {
        const audioTypes = ['audio/mpeg', 'audio/wav', 'audio/ogg', 'audio/flac', 'audio/aac', 'audio/mp4', 'audio/x-m4a', 'audio/webm'];
        const audioExts = ['mp3', 'wav', 'ogg', 'flac', 'aac', 'm4a', 'webm', 'opus'];

        let added = 0;
        for (const f of fileListObj) {
            const ext = getExt(f.name);
            const isValid = audioTypes.includes(f.type) || audioExts.includes(ext);
            if (!isValid) {
                addLog(`Skipped: ${f.name} (bukan audio)`, 'warn');
                continue;
            }
            // Cek duplikat
            if (files.some(ef => ef.name === f.name && ef.size === f.size)) {
                addLog(`Duplikat: ${f.name}`, 'warn');
                continue;
            }
            files.push({ name: f.name, size: f.size, file: f, status: 'pending', progress: 0 });
            added++;
        }

        if (added > 0) {
            addLog(`${added} file ditambahkan ke queue`, 'info');
            showToast(`${added} file ditambahkan`, 'success');
        }
        renderFiles();
    }

    // === Hapus file ===
    function removeFile(index) {
        if (isConverting) return;
        const name = files[index].name;
        files.splice(index, 1);
        addLog(`Dihapus: ${name}`, 'warn');
        renderFiles();
    }

    // === Clear all ===
    btnClearAll.addEventListener('click', () => {
        if (isConverting) {
            showToast('Tidak bisa hapus saat konversi', 'error');
            return;
        }
        if (files.length === 0) return;
        files = [];
        addLog('Semua file dihapus', 'warn');
        showToast('Semua file dihapus', 'info');
        renderFiles();
    });

    // === Clear log ===
    btnClearLog.addEventListener('click', () => {
        logBody.innerHTML = '<div class="log-empty">Menunggu aktivitas...</div>';
        logCleared = false;
    });

    // === Upload button ===
    btnUpload.addEventListener('click', () => {
        if (isConverting) {
            showToast('Tunggu konversi selesai', 'error');
            return;
        }
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            addFiles(e.target.files);
            fileInput.value = '';
        }
    });

    // === Drag & Drop ===
    appContainer.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropOverlay.classList.add('active');
    });

    appContainer.addEventListener('dragleave', (e) => {
        if (!appContainer.contains(e.relatedTarget)) {
            dropOverlay.classList.remove('active');
        }
    });

    appContainer.addEventListener('drop', (e) => {
        e.preventDefault();
        dropOverlay.classList.remove('active');
        if (isConverting) {
            showToast('Tunggu konversi selesai', 'error');
            return;
        }
        if (e.dataTransfer.files.length > 0) {
            addFiles(e.dataTransfer.files);
        }
    });

    // === Simulasi Konversi ===
    btnConvert.addEventListener('click', async () => {
        if (isConverting || files.length === 0) return;
        isConverting = true;
        btnConvert.disabled = true;
        btnConvert.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Converting...';

        const targetFormat = formatSelect.value;
        addLog(`Memulai konversi ke ${targetFormat.toUpperCase()}...`, 'system');
        addLog(`Total ${files.length} file dalam queue`, 'system');

        for (let i = 0; i < files.length; i++) {
            const f = files[i];
            const ext = getExt(f.name);

            if (ext === targetFormat) {
                f.status = 'done';
                f.progress = 100;
                renderFiles();
                addLog(`${f.name} — format sama, dilewati`, 'warn');
                continue;
            }

            f.status = 'converting';
            f.progress = 0;
            renderFiles();
            addLog(`Mengkonversi: ${f.name}`, 'info');

            // Simulasi progress
            const steps = 10;
            const baseName = f.name.replace(/\.[^/.]+$/, '');

            for (let s = 1; s <= steps; s++) {
                await new Promise(r => setTimeout(r, 200 + Math.random() * 300));
                f.progress = Math.min(100, Math.round((s / steps) * 100));
                // Update progress bar langsung tanpa re-render full
                const bar = document.getElementById(`progress-${i}`);
                if (bar) bar.style.width = f.progress + '%';
            }

            // Simulasi sukses/error (95% sukses)
            const success = Math.random() > 0.05;
            if (success) {
                f.status = 'done';
                const newName = `${baseName}.${targetFormat}`;
                addLog(`${newName} — converted successfully`, 'success');
            } else {
                f.status = 'error';
                addLog(`${f.name} — conversion failed`, 'error');
            }
            renderFiles();
        }

        addLog(`All tasks completed`, 'system');
        showToast('Konversi selesai!', 'success');

        isConverting = false;
        btnConvert.disabled = false;
        btnConvert.innerHTML = '<i class="fas fa-bolt"></i> Convert';
    });

    // === Init: render awal ===
    renderFiles();
</script>

</body>
</html>
